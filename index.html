<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CIDA - Home</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React e ReactDOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel Standalone -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Lucide Icons via CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-900 m-0 p-0 font-sans">
  <div id="root"></div>

  <script type="text/babel">
    const { useEffect } = React;

    function App() {
      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      }, []);

      return (
        <div className="flex justify-center bg-slate-900 min-h-screen p-0 sm:p-4">
          {/* Container Mobile */}
          <div className="w-full max-w-[420px] bg-slate-100 min-h-screen flex flex-col justify-between relative shadow-2xl overflow-hidden sm:rounded-[44px] border border-slate-300">
            
            {/* Scroll do Conteúdo */}
            <div className="flex-1 overflow-y-auto">
              
              {/* Topo Azul Marinho Curvado */}
              <div className="bg-[#15284B] pt-8 px-6 pb-12 rounded-b-[36px] shadow-md relative">
                {/* Header: Logo e Foto */}
                <header className="flex justify-between items-center mb-5">
                  <div className="flex items-center gap-2">
                    <i data-lucide="heart" className="w-6 h-6 text-emerald-400 stroke-[2.5]"></i>
                    <span className="text-2xl font-black tracking-wider text-white">CIDA</span>
                  </div>
                  
                  <img 
                    src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=120&auto=format&fit=crop&q=80" 
                    alt="Foto de perfil de Seu João" 
                    className="w-11 h-11 rounded-full object-cover border-2 border-white/80 shadow"
                  />
                </header>

                {/* Saudação */}
                <div className="mb-6">
                  <h1 className="text-3xl font-extrabold text-white tracking-tight">
                    Olá, Seu João!
                  </h1>
                  <p className="text-slate-300 text-sm font-medium mt-0.5">
                    Cuidado para idosos
                  </p>
                </div>

                {/* Botão SOS Emergência */}
                <button 
                  type="button"
                  onClick={() => alert("SOS Disparado!")}
                  className="w-full bg-[#E02938] hover:bg-red-700 active:scale-[0.98] transition-all text-white rounded-2xl py-4 px-5 flex items-center justify-center gap-3 shadow-lg shadow-black/25 cursor-pointer"
                >
                  <i data-lucide="ambulance" className="w-7 h-7 stroke-[2.5]"></i>
                  <span className="text-xl font-black tracking-wider uppercase">
                    SOS EMERGÊNCIA
                  </span>
                </button>
              </div>

              {/* Área Inferior com Fundo Claro */}
              <div className="px-5 pt-5 pb-6">
                
                {/* Card Próxima Dose */}
                <div className="bg-white rounded-2xl p-4 border border-slate-200 shadow-sm flex items-center justify-between mb-6">
                  <div className="flex items-center gap-3.5">
                    <div className="w-12 h-12 rounded-xl bg-emerald-50 flex items-center justify-center text-emerald-600 border border-emerald-100">
                      <i data-lucide="pill" className="w-6 h-6 rotate-45 stroke-[2.2]"></i>
                    </div>
                    <div>
                      <span className="text-[11px] font-bold tracking-wider text-slate-400 uppercase block">
                        PRÓXIMA DOSE
                      </span>
                      <p className="text-base font-extrabold text-slate-900 leading-tight">
                        10:00 - Losartana
                      </p>
                      <span className="text-xs font-semibold text-slate-500">50mg</span>
                    </div>
                  </div>

                  <img 
                    src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100&auto=format&fit=crop&q=80" 
                    alt="Cuidadora responsável" 
                    className="w-9 h-9 rounded-full object-cover border border-slate-200"
                  />
                </div>

                {/* Atalhos Rápidos */}
                <section>
                  <h2 className="text-lg font-bold text-slate-900 mb-3 px-1">
                    Atalhos rápidos
                  </h2>
                  
                  {/* Grid de Atalhos com Maior Destaque e Bordas Definidas */}
                  <div className="grid grid-cols-2 gap-3">
                    {/* Meus Remédios */}
                    <button 
                      type="button"
                      className="bg-white p-4 rounded-2xl border-2 border-slate-200/80 shadow-sm hover:shadow-md hover:border-emerald-300 transition-all flex flex-col items-start gap-2.5 text-left active:scale-[0.98]"
                    >
                      <div className="w-10 h-10 rounded-xl bg-emerald-100/70 flex items-center justify-center text-emerald-700">
                        <i data-lucide="pill" className="w-5 h-5 rotate-45 stroke-[2.4]"></i>
                      </div>
                      <span className="font-bold text-slate-900 text-sm leading-snug">
                        Meus Remédios
                      </span>
                    </button>

                    {/* Minha Rotina */}
                    <button 
                      type="button"
                      className="bg-white p-4 rounded-2xl border-2 border-slate-200/80 shadow-sm hover:shadow-md hover:border-amber-300 transition-all flex flex-col items-start gap-2.5 text-left active:scale-[0.98]"
                    >
                      <div className="w-10 h-10 rounded-xl bg-amber-100/70 flex items-center justify-center text-amber-700">
                        <i data-lucide="calendar" className="w-5 h-5 stroke-[2.4]"></i>
                      </div>
                      <span className="font-bold text-slate-900 text-sm leading-snug">
                        Minha Rotina
                      </span>
                    </button>

                    {/* Anotações */}
                    <button 
                      type="button"
                      className="bg-white p-4 rounded-2xl border-2 border-slate-200/80 shadow-sm hover:shadow-md hover:border-blue-300 transition-all flex flex-col items-start gap-2.5 text-left active:scale-[0.98]"
                    >
                      <div className="w-10 h-10 rounded-xl bg-blue-100/70 flex items-center justify-center text-blue-700">
                        <i data-lucide="file-text" className="w-5 h-5 stroke-[2.4]"></i>
                      </div>
                      <span className="font-bold text-slate-900 text-sm leading-snug">
                        Anotações
                      </span>
                    </button>

                    {/* Contatos */}
                    <button 
                      type="button"
                      className="bg-white p-4 rounded-2xl border-2 border-slate-200/80 shadow-sm hover:shadow-md hover:border-purple-300 transition-all flex flex-col items-start gap-2.5 text-left active:scale-[0.98]"
                    >
                      <div className="w-10 h-10 rounded-xl bg-purple-100/70 flex items-center justify-center text-purple-700">
                        <i data-lucide="phone" className="w-5 h-5 stroke-[2.4]"></i>
                      </div>
                      <span className="font-bold text-slate-900 text-sm leading-snug">
                        Contatos
                      </span>
                    </button>
                  </div>
                </section>

              </div>
            </div>

            {/* Footer / Barra Inferior Mais Marcada */}
            <nav className="bg-white border-t-2 border-slate-200 py-3 px-3 flex justify-around items-center shadow-[0_-4px_16px_rgba(0,0,0,0.06)] relative z-10">
              
              {/* Home Ativa */}
              <button type="button" className="flex flex-col items-center justify-center py-1 px-3 rounded-xl text-slate-900 font-bold transition-all">
                <i data-lucide="home" className="w-6 h-6 stroke-[2.5]"></i>
                <span className="text-xs mt-1">Home</span>
              </button>

              {/* Remédios */}
              <button type="button" className="flex flex-col items-center justify-center py-1 px-3 rounded-xl text-slate-500 hover:text-slate-800 font-semibold transition-all">
                <i data-lucide="pill" className="w-6 h-6 rotate-45 stroke-[2]"></i>
                <span className="text-xs mt-1">Remédios</span>
              </button>

              {/* Rotina */}
              <button type="button" className="flex flex-col items-center justify-center py-1 px-3 rounded-xl text-slate-500 hover:text-slate-800 font-semibold transition-all">
                <i data-lucide="calendar" className="w-6 h-6 stroke-[2]"></i>
                <span className="text-xs mt-1">Rotina</span>
              </button>

              {/* Perfil */}
              <button type="button" className="flex flex-col items-center justify-center py-1 px-3 rounded-xl text-slate-500 hover:text-slate-800 font-semibold transition-all">
                <i data-lucide="user" className="w-6 h-6 stroke-[2]"></i>
                <span className="text-xs mt-1">Perfil</span>
              </button>
            </nav>

          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
