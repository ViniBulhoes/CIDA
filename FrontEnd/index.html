<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CIDA - Entrar</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React e ReactDOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel Standalone -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Lucide Icons via CDN para os ícones estáticos -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-900 m-0 p-0 font-sans">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function LoginScreen() {
      const [showPassword, setShowPassword] = useState(false);
      const [password, setPassword] = useState("123456");

      // Roda uma única vez na inicialização para os ícones estáticos
      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      }, []);

      return (
        <div className="flex justify-center items-center bg-slate-900 min-h-screen p-0 sm:p-4">
          {/* Container Mobile Travado na Proporção */}
          <div className="w-full max-w-[420px] bg-slate-100 h-screen sm:h-[844px] flex flex-col justify-between relative shadow-2xl overflow-hidden sm:rounded-[44px] border border-slate-300">
            
            {/* Topo Azul com Logo e Boas-vindas */}
            <div className="bg-[#15284B] pt-10 px-6 pb-8 rounded-b-[36px] shadow-md text-center shrink-0">
              <div className="flex justify-center items-center gap-2 mb-3">
                <i data-lucide="heart" className="w-8 h-8 text-emerald-400 stroke-[2.5]"></i>
                <span className="text-3xl font-black tracking-wider text-white">CIDA</span>
              </div>
              <h1 className="text-2xl font-extrabold text-white tracking-tight">
                Que bom ver você!
              </h1>
              <p className="text-slate-300 text-sm font-medium mt-1">
                Digite seus dados para acessar sua rotina
              </p>
            </div>

            {/* Formulário Principal */}
            <div className="flex-1 px-6 py-6 flex flex-col justify-center">
              <form 
                className="space-y-4" 
                onSubmit={(e) => { 
                  e.preventDefault(); 
                  window.location.href = 'home.html'; 
                }}
              >
                
                {/* Campo Telefone / CPF */}
                <div>
                  <label className="block text-sm font-bold text-slate-800 mb-1.5 ml-1">
                    Seu Celular ou CPF
                  </label>
                  <div className="relative flex items-center">
                    <span className="absolute left-4 text-slate-500">
                      <i data-lucide="user" className="w-5 h-5"></i>
                    </span>
                    <input 
                      type="text" 
                      defaultValue="(11) 98765-4321" 
                      className="w-full bg-white text-slate-900 font-bold pl-12 pr-4 py-4 rounded-2xl border-2 border-slate-300 focus:border-emerald-500 focus:outline-none text-base shadow-sm"
                    />
                  </div>
                </div>

                {/* Campo Senha com Alternância Segura sem Quebras */}
                <div>
                  <label className="block text-sm font-bold text-slate-800 mb-1.5 ml-1">
                    Sua Senha
                  </label>
                  <div className="relative flex items-center">
                    <span className="absolute left-4 text-slate-500">
                      <i data-lucide="lock" className="w-5 h-5"></i>
                    </span>
                    <input 
                      type={showPassword ? "text" : "password"}
                      value={password}
                      onChange={(e) => setPassword(e.target.value)}
                      className={`w-full bg-white text-slate-900 font-bold pl-12 pr-14 py-4 rounded-2xl border-2 border-slate-300 focus:border-emerald-500 focus:outline-none text-base shadow-sm ${
                        !showPassword ? 'tracking-widest' : 'tracking-normal'
                      }`}
                    />
                    
                    {/* Botão de Alternar Olho em SVG Nativo (não quebra o React) */}
                    <button 
                      type="button" 
                      onClick={() => setShowPassword(!showPassword)}
                      aria-label={showPassword ? "Ocultar senha" : "Ver senha"}
                      className="absolute right-2 w-10 h-10 flex items-center justify-center text-slate-500 hover:text-slate-800 active:scale-90 transition-transform cursor-pointer"
                    >
                      {showPassword ? (
                        /* Ícone Olho Aberto (Eye) */
                        <svg className="w-5 h-5 stroke-[2.2]" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeLinecap="round" strokeLinejoin="round">
                          <path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0" />
                          <circle cx="12" cy="12" r="3" />
                        </svg>
                      ) : (
                        /* Ícone Olho Cortado/Fechado (Eye-off) */
                        <svg className="w-5 h-5 stroke-[2.2]" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeLinecap="round" strokeLinejoin="round">
                          <path d="m15 18-.722-3.25" />
                          <path d="M2 8a10.645 10.645 0 0 0 20 0" />
                          <path d="m20 15-1.726-2.05" />
                          <path d="m4 15 1.726-2.05" />
                          <path d="m9 18 .722-3.25" />
                        </svg>
                      )}
                    </button>
                  </div>
                </div>

                {/* Botão Entrar */}
                <button 
                  type="submit"
                  className="w-full bg-emerald-600 hover:bg-emerald-700 active:scale-[0.98] transition-all text-white font-extrabold text-lg py-4 px-6 rounded-2xl shadow-lg shadow-emerald-700/20 flex items-center justify-center gap-2 cursor-pointer mt-2"
                >
                  <span>Entrar no CIDA</span>
                  <i data-lucide="arrow-right" className="w-5 h-5 stroke-[2.5]"></i>
                </button>

                <div className="text-center pt-1">
                  <button 
                    type="button" 
                    onClick={() => alert("Ajuda para recuperar acesso")}
                    className="text-xs font-bold text-slate-500 hover:text-slate-800 underline p-1 cursor-pointer"
                  >
                    Esqueceu a senha? Peça ajuda aqui
                  </button>
                </div>
              </form>
            </div>

            {/* Separador e Acesso ao Cuidador */}
            <div className="p-6 pt-0 shrink-0">
              <div className="bg-white rounded-2xl p-4 border-2 border-slate-200/80 shadow-sm flex items-center justify-between">
                <div className="flex items-center gap-3">
                  <div className="w-10 h-10 rounded-xl bg-blue-50 text-blue-700 flex items-center justify-center shrink-0">
                    <i data-lucide="heart-handshake" className="w-5 h-5 stroke-[2.2]"></i>
                  </div>
                  <div className="text-left">
                    <h2 className="text-xs font-bold text-slate-900 leading-tight">
                      É familiar ou cuidador?
                    </h2>
                    <span className="text-[11px] font-medium text-slate-500 block mt-0.5">
                      Acesse a área de gerenciamento
                    </span>
                  </div>
                </div>

                <button 
                  type="button" 
                  onClick={() => alert("Redirecionando para login do cuidador")}
                  className="bg-slate-100 hover:bg-slate-200 text-slate-800 font-bold text-xs py-2 px-3 rounded-xl border border-slate-300 transition-colors cursor-pointer"
                >
                  Entrar aqui
                </button>
              </div>
            </div>

          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<LoginScreen />);
  </script>
</body>
</html>
