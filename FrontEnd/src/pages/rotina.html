<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CIDA - Minha Rotina</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React e ReactDOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel Standalone -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Lucide Icons via CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-900 m-0 p-0 font-sans">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function RotinaScreen() {
      // Estado da data selecionada (inicia com o dia de hoje)
      const [currentDate, setCurrentDate] = useState(new Date());

      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      }, []);

      // Funções para avançar e voltar dias
      const mudarDia = (dias) => {
        setCurrentDate(prevDate => {
          const novaData = new Date(prevDate);
          novaData.setDate(novaData.getDate() + dias);
          return novaData;
        });
      };

      // Formatação amigável para idosos (Ex: "Hoje, 27 de Agosto")
      const formatarData = (data) => {
        const hoje = new Date();
        const ehHoje = data.toDateString() === hoje.toDateString();
        
        const amanha = new Date(hoje);
        amanha.setDate(hoje.getDate() + 1);
        const ehAmanha = data.toDateString() === amanha.toDateString();

        const ontem = new Date(hoje);
        ontem.setDate(hoje.getDate() - 1);
        const ehOntem = data.toDateString() === ontem.toDateString();

        const dia = data.getDate();
        const meses = [
          'Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho',
          'Julho', 'Agosto', 'Setembro', 'Outubro', 'Novembro', 'Dezembro'
        ];
        const mes = meses[data.getMonth()];

        if (ehHoje) return `Hoje, ${dia} de ${mes}`;
        if (ehAmanha) return `Amanhã, ${dia} de ${mes}`;
        if (ehOntem) return `Ontem, ${dia} de ${mes}`;

        const diasSemana = ['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'];
        return `${diasSemana[data.getDay()]}, ${dia} de ${mes}`;
      };

      return (
        <div className="flex justify-center bg-slate-900 min-h-screen p-0 sm:p-4">
          {/* Container Mobile */}
          <div className="w-full max-w-[420px] bg-slate-100 min-h-screen flex flex-col justify-between relative shadow-2xl overflow-hidden sm:rounded-[44px] border border-slate-300">
            
            {/* Área Rolável de Conteúdo */}
            <div className="flex-1 overflow-y-auto">
              
              {/* Topo Azul Marinho Curvado */}
              <div className="bg-[#15284B] pt-8 px-6 pb-7 rounded-b-[36px] shadow-md relative">
                {/* Header: Logo e Foto */}
                <header className="flex justify-between items-center mb-5">
                  <div className="flex items-center gap-2">
                    <i data-lucide="heart" className="w-6 h-6 text-emerald-400 stroke-[2.5]"></i>
                    <span className="text-2xl font-black tracking-wider text-white">CIDA</span>
                  </div>
                  
                  {/* Foto de Perfil Redirecionando para perfil.html */}
                  <button 
                    type="button" 
                    onClick={() => window.location.href = 'perfil.html'}
                    title="Ir para o Perfil"
                    aria-label="Ir para o Perfil"
                    className="rounded-full transition-transform active:scale-90 hover:opacity-90 cursor-pointer focus:outline-none"
                  >
                    <img 
                      src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=120&auto=format&fit=crop&q=80" 
                      alt="Foto de perfil de Seu João" 
                      className="w-11 h-11 rounded-full object-cover border-2 border-white/80 shadow"
                    />
                  </button>
                </header>

                {/* Título da Tela */}
                <div className="mb-5">
                  <h1 className="text-3xl font-extrabold text-white tracking-tight">
                    Minha Rotina
                  </h1>
                </div>

                {/* Navegador de Datas Interativo */}
                <div className="flex items-center justify-between bg-white/10 backdrop-blur-md rounded-2xl py-2 px-3 border border-white/15 text-white shadow-inner">
                  {/* Voltar Dia */}
                  <button 
                    type="button" 
                    onClick={() => mudarDia(-1)}
                    aria-label="Dia anterior"
                    className="w-10 h-10 flex items-center justify-center hover:bg-white/20 active:scale-90 rounded-xl transition-all cursor-pointer"
                  >
                    <svg className="w-5 h-5 stroke-[2.5]" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeLinecap="round" strokeLinejoin="round">
                      <path d="m15 18-6-6 6-6" />
                    </svg>
                  </button>

                  <span className="font-extrabold text-sm tracking-wide select-none">
                    {formatarData(currentDate)}
                  </span>

                  {/* Avançar Dia */}
                  <button 
                    type="button" 
                    onClick={() => mudarDia(1)}
                    aria-label="Próximo dia"
                    className="w-10 h-10 flex items-center justify-center hover:bg-white/20 active:scale-90 rounded-xl transition-all cursor-pointer"
                  >
                    <svg className="w-5 h-5 stroke-[2.5]" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeLinecap="round" strokeLinejoin="round">
                      <path d="m9 18 6-6-6-6" />
                    </svg>
                  </button>
                </div>
              </div>

              {/* Linha do Tempo e Lista de Cuidados */}
              <div className="px-5 pt-6 pb-6">
                <div className="relative border-l-2 border-slate-300 ml-3.5 pl-6 space-y-6">
                  
                  {/* Item 1: 08:00 - Tomado (Verde) */}
                  <div className="relative">
                    <div className="absolute -left-[31px] top-1.5 w-3.5 h-3.5 rounded-full bg-emerald-500 ring-4 ring-slate-100"></div>

                    <div className="bg-white rounded-2xl p-4 border-2 border-emerald-400 shadow-sm">
                      <div className="flex justify-between items-start mb-1.5">
                        <span className="text-xs font-black text-slate-900">08:00</span>
                        <span className="bg-emerald-100 text-emerald-700 font-bold text-[10px] px-2.5 py-0.5 rounded-full uppercase tracking-wider">
                          Tomado
                        </span>
                      </div>
                      <h3 className="text-sm font-extrabold text-slate-900 leading-snug">
                        Café da manhã e Insulina
                      </h3>
                      <p className="text-xs text-slate-500 font-medium mt-0.5">
                        Aplicar 10 unidades antes de comer.
                      </p>
                    </div>
                  </div>

                  {/* Item 2: 10:00 - Pendente (Laranja / Botão Ativo) */}
                  <div className="relative">
                    <div className="absolute -left-[31px] top-1.5 w-3.5 h-3.5 rounded-full bg-amber-500 ring-4 ring-slate-100"></div>

                    <div className="bg-white rounded-2xl p-4 border-2 border-amber-300 shadow-sm">
                      <div className="flex justify-between items-start mb-1.5">
                        <span className="text-xs font-black text-slate-900">10:00</span>
                        <span className="bg-amber-100 text-amber-700 font-bold text-[10px] px-2.5 py-0.5 rounded-full uppercase tracking-wider">
                          Pendente
                        </span>
                      </div>
                      <h3 className="text-sm font-extrabold text-slate-900 leading-snug">
                        Losartana 50mg
                      </h3>
                      <p className="text-xs text-slate-500 font-medium mt-0.5 mb-3.5">
                        Tomar com um copo cheio de água.
                      </p>
                      
                      <button 
                        type="button" 
                        onClick={() => alert("Dose confirmada!")}
                        className="w-full bg-[#FA8C16] hover:bg-[#d97706] active:scale-[0.98] transition-all text-white font-bold text-xs py-3 px-4 rounded-xl shadow-md flex items-center justify-center gap-1.5 cursor-pointer"
                      >
                        Confirmar Realizado
                      </button>
                    </div>
                  </div>

                  {/* Item 3: 13:00 - Pendente (Almoço) */}
                  <div className="relative">
                    <div className="absolute -left-[31px] top-1.5 w-3.5 h-3.5 rounded-full bg-slate-400 ring-4 ring-slate-100"></div>

                    <div className="bg-white rounded-2xl p-4 border border-slate-200 shadow-sm">
                      <div className="flex justify-between items-start mb-1.5">
                        <span className="text-xs font-black text-slate-900">13:00</span>
                        <span className="bg-slate-100 text-slate-600 font-bold text-[10px] px-2.5 py-0.5 rounded-full uppercase tracking-wider">
                          Pendente
                        </span>
                      </div>
                      <h3 className="text-sm font-extrabold text-slate-900 leading-snug">
                        Almoço saudável
                      </h3>
                      <p className="text-xs text-slate-500 font-medium mt-0.5 mb-3.5">
                        Evitar alimentos com muito sal.
                      </p>
                      
                      <button 
                        type="button" 
                        onClick={() => alert("Almoço confirmado!")}
                        className="w-full bg-[#15284B] hover:bg-[#1f3a6d] active:scale-[0.98] transition-all text-white font-bold text-xs py-3 px-4 rounded-xl shadow-sm flex items-center justify-center gap-1.5 cursor-pointer"
                      >
                        Confirmar Realizado
                      </button>
                    </div>
                  </div>

                </div>
              </div>

            </div>

            {/* Footer / Barra Inferior (Aba Rotina Ativa) */}
            <nav className="bg-white border-t-2 border-slate-200 py-3 px-3 flex justify-around items-center shadow-[0_-4px_16px_rgba(0,0,0,0.06)] relative z-10">
              
              {/* Home */}
              <button 
                type="button" 
                onClick={() => window.location.href = 'home.html'} 
                className="flex flex-col items-center justify-center py-1 px-3 rounded-xl text-slate-500 hover:text-slate-800 font-semibold transition-all cursor-pointer"
              >
                <i data-lucide="home" className="w-6 h-6 stroke-[2]"></i>
                <span className="text-xs mt-1">Home</span>
              </button>

              {/* Remédios */}
              <button 
                type="button" 
                onClick={() => window.location.href = 'remedios.html'} 
                className="flex flex-col items-center justify-center py-1 px-3 rounded-xl text-slate-500 hover:text-slate-800 font-semibold transition-all cursor-pointer"
              >
                <i data-lucide="pill" className="w-6 h-6 rotate-45 stroke-[2]"></i>
                <span className="text-xs mt-1">Remédios</span>
              </button>

              {/* Rotina Ativa */}
              <button 
                type="button" 
                onClick={() => window.location.href = 'rotina.html'} 
                className="flex flex-col items-center justify-center py-1 px-3 rounded-xl text-slate-900 font-bold transition-all cursor-pointer"
              >
                <i data-lucide="calendar" className="w-6 h-6 stroke-[2.5]"></i>
                <span className="text-xs mt-1">Rotina</span>
              </button>

              {/* Perfil */}
              <button 
                type="button" 
                onClick={() => window.location.href = 'perfil.html'} 
                className="flex flex-col items-center justify-center py-1 px-3 rounded-xl text-slate-500 hover:text-slate-800 font-semibold transition-all cursor-pointer"
              >
                <i data-lucide="user" className="w-6 h-6 stroke-[2]"></i>
                <span className="text-xs mt-1">Perfil</span>
              </button>
            </nav>

          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<RotinaScreen />);
  </script>
</body>
</html>
