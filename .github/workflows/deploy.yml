name: Deploy do CIDA no GitHub Pages

on:
  push:
    branches: ['main'] # Se a branch for master, troque para 'master'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Cida/FrontEnd
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependências
        run: npm install

      - name: Build do Vite
        run: npx vite build

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Upload dos arquivos compilados
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'Cida/FrontEnd/dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
