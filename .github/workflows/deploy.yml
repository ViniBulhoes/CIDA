name: Deploy do CIDA no GitHub Pages

on:
  push:
    branches: ['main'] # Se a sua branch for master, troque para 'master'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Descobrir pasta do projeto e compilar
        run: |
          echo "Buscando o arquivo package.json no repositório..."
          PKG_PATH=$(find . -name "package.json" -not -path "*/node_modules/*" | head -n 1)
          
          if [ -z "$PKG_PATH" ]; then
            echo "ERRO: package.json não foi encontrado!"
            ls -la
            exit 1
          fi

          APP_DIR=$(dirname "$PKG_PATH")
          echo "Pasta do projeto encontrada em: $APP_DIR"
          
          cd "$APP_DIR"
          npm install
          npx vite build
          
          # Salva o caminho do dist para a próxima etapa
          mkdir -p $GITHUB_WORKSPACE/_upload
          cp -r dist/* $GITHUB_WORKSPACE/_upload/

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Upload dos arquivos compilados
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_upload'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
